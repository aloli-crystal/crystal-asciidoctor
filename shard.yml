name: crystal-asciidoctor
version: 2.0.26.11

description: |
  A Crystal port of the Asciidoctor document processor.
  Provides an AST model and parser for AsciiDoc documents.
  Ported from Ruby Asciidoctor 2.0.26 (2025-10-24).

authors:
  - Philippe Nénert pour ALOLI sas à Laguiole

# Le shard est à la fois une BIBLIOTHÈQUE (AST + parser, utilisée par
# crystal-asciidoctor-pdf) et un EXÉCUTABLE : `crystal-asciidoctor`,
# équivalent de la commande `asciidoctor` Ruby (.adoc → HTML/DocBook/
# manpage). Sans cette section, `shards build` ne produisait rien.
targets:
  crystal-asciidoctor:
    main: src/cli.cr

dependencies:
  crystal-rouge:
    github: aloli-crystal/crystal-rouge
    version: "~> 4.7"

crystal: ">= 1.19.0"

license: MIT

repository: https://github.com/aloli-crystal/crystal-asciidoctor
